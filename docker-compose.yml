services:
  db:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_USER: wishify
      POSTGRES_PASSWORD: wishify
      POSTGRES_DB: wishify
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wishify -d wishify']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql

volumes:
  database:
